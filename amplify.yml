version: 1
backend:
  phases:
    build:
      commands:
        # Expo SDK 58 needs Node 20.19+ or 22. Use a preinstalled one (no download) and print the version.
        - nvm use 22 || echo "Node 22 not preinstalled; using the default"
        - node -v
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || echo "Node 22 not preinstalled; using the default"
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
